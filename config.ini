# Настройки TpF3 Mod Downloader.
# Комментарий начинается с «#» или «;».
# Его можно писать отдельной строкой или в конце строки после пробела.
# Пример: «extract_dir = C:\Mods  # моя папка»
# Путь вроде «C:\Games\Mods#1», где перед «#» нет пробела, не меняется.
# Значения можно писать и на русском, и на английском, регистр не важен.
# Примеры: да / yes / true, нет / no / false.

[paths]
# Куда распаковывать моды. Если оставить пустым, моды только скачиваются.
extract_dir = C:\Games\Буфер TpF3

# Куда сохранять ZIP-архивы. Если оставить пустым, это папка «Загрузки».
# Если папка не существует или путь неполный, ZIP сохраняются в «Загрузки».
downloads_dir =

[behavior]
# Оставлять ZIP после распаковки: да / нет
# (нет: ZIP удаляется после успешной распаковки).
keep_zip = да

# Что делать при ошибках CRC в архиве: спрашивать / остановить
# (остановить: никогда не предлагать продолжить распаковку).
crc_policy = спрашивать
